<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planner | Taskora AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body class="app">

    <aside class="side">
        <a class="logo" href="index.html">Taskora AI</a>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="tasks.html">Tasks</a>
            <a class="active" href="planner.html">Planner</a>
            <a href="calendar.html">Calendar</a>
            <a href="settings.html">Settings</a>
        </nav>
        <a class="out" href="login.html">Log out</a>
    </aside>

    <main class="panel">
        <h1>Planner</h1>

        <div class="cols">
            <section class="box">
                <h2>Morning</h2>
                <ul class="tasks">
                    <li class="task"><span class="time">9:00</span><span>Deep work: proposal</span></li>
                    <li class="task"><span class="time">11:00</span><span>Team stand-up</span></li>
                </ul>
            </section>

            <section class="box">
                <h2>Afternoon</h2>
                <ul class="tasks">
                    <li class="task"><span class="time">1:00</span><span>Client emails</span></li>
                    <li class="task"><span class="time">3:00</span><span>Weekly report</span></li>
                </ul>
            </section>

            <section class="box">
                <h2>Evening</h2>
                <ul class="tasks">
                    <li class="task"><span class="time">6:30</span><span>Gym</span></li>
                    <li class="task"><span class="time">8:00</span><span>Plan tomorrow</span></li>
                </ul>
            </section>
        </div>
    </main>

</body>

</html>
