<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Taskora AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>

    <header class="nav">
        <a class="logo" href="index.html">Taskora AI</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="pricing.html">Pricing</a>
            <a href="about.html">About</a>
            <a class="active" href="contact.html">Contact</a>
        </nav>
        <div class="nav-cta">
            <a href="login.html">Log in</a>
            <a class="btn" href="signup.html">Start free</a>
        </div>
    </header>

    <main>
        <section class="section narrow">
            <h1>Contact us</h1>
            <p class="lead">Questions about plans or your account? Send a message.</p>

            <form class="form" action="#" method="post">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" required>

                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button class="btn" type="submit">Send message</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Taskora AI</p>
    </footer>

</body>

</html>
