<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up | Taskora AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body class="auth-page">

    <a class="logo" href="index.html">Taskora AI</a>

    <main class="auth-card">
        <h1>Create your account</h1>

        <form class="form" action="dashboard.html">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="8" required>

            <button class="btn" type="submit">Create account</button>
        </form>

        <p class="alt">Already have an account? <a href="login.html">Log in</a></p>
    </main>

</body>

</html>
